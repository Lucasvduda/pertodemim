spring:
  application:
    name: pertodemim-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:pertodemim;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Em produção/demonstração real defina JWT_SECRET (mínimo 32 caracteres). O padrão abaixo serve só para desenvolvimento local.
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789abcdef}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}
  iot:
    # Semente usada para derivar a chave de cada dispositivo simulado (o simulador usa a mesma semente).
    chave-semente: ${IOT_KEY_SEED:dev-only-iot-seed}
    heartbeat-max-minutos: 2
    presenca-max-horas: 4
    minutos-por-pessoa-na-fila: 5
  bronze:
    dir: ${BRONZE_DIR:../../area2_dados/bronze}
  seed:
    habilitado: true
    # estado inicial "fresco": unidades online e profissionais presentes ao subir (útil sem o simulador)
    estado-inicial-fresco: true
  rate-limit:
    triagem-por-minuto: ${RATE_TRIAGEM:30}
    login-por-minuto: ${RATE_LOGIN:10}
  llm:
    # rules (padrão, sem chave) | groq | gemini | openai | ollama
    provider: ${LLM_PROVIDER:rules}
    timeout-ms: ${LLM_TIMEOUT_MS:8000}
    groq:
      base-url: https://api.groq.com/openai/v1
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      api-key: ${GROQ_API_KEY:}
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      api-key: ${GEMINI_API_KEY:}
    openai:
      base-url: https://api.openai.com/v1
      model: ${OPENAI_MODEL:gpt-4o-mini}
      api-key: ${OPENAI_API_KEY:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
      model: ${OLLAMA_MODEL:qwen3.5:4b}
      api-key: ollama
