name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Maven verify + Jacoco)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes + cobertura
        working-directory: area3_mvp/api
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco
          path: area3_mvp/api/target/site/jacoco
          if-no-files-found: ignore

  python:
    name: Python (${{ matrix.area }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [area1_ia, area2_dados, area3_mvp/iot_mock, area4_devops]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            area2_dados/requirements.txt
            area3_mvp/iot_mock/requirements.txt
            area4_devops/requirements.txt
      - name: Dependências
        run: pip install -r area2_dados/requirements.txt -r area3_mvp/iot_mock/requirements.txt -r area4_devops/requirements.txt
      - name: Testes
        working-directory: ${{ matrix.area }}
        run: python -m pytest -q

  docker:
    name: Docker (build das imagens)
    runs-on: ubuntu-latest
    needs: [api, python]
    steps:
      - uses: actions/checkout@v4
      - name: compose válido
        run: docker compose config -q
      - name: Build
        run: docker compose --profile demo build
